<aside class="sidebar" id="sidebar">

    <a href="#/radar" data-route="radar"><svg class="ico"><use href="#i-radar"/></svg>Radar de virais</a>

    <a href="#/formatos" data-route="formatos"><svg class="ico"><use href="#i-layers"/></svg>Formatos</a>
    <span class="nav-group">Produção</span>
    <a href="#/roteiros" data-route="roteiros"><svg class="ico"><use href="#i-script"/></svg>Estúdio de roteiro</a>
    <a href="#/pipeline" data-route="pipeline"><svg class="ico"><use href="#i-kanban"/></svg>Pipeline</a>
    <a href="#/calendario" data-route="calendario"><svg class="ico"><use href="#i-calendar"/></svg>Calendário</a>
    <span class="nav-group">Rede</span>

    <div class="quota-note">
      <svg class="ico"><use href="#i-bolt"/></svg>
      <span><strong id="sideQuota">0</strong> unidades / atualização</span>
    </div>
    <p>Dados salvos neste navegador.</p>
  </div>
</aside>

<div class="shell">
  <header class="topbar">
    <button class="btn-icon nav-toggle" id="navToggle" aria-label="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>

    <label class="niche-pick">
      <span>Nicho</span>
      <select id="nichePick" aria-label="Nicho ativo"></select>
    </label>

    <div class="global-search">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="globalSearch" type="search" placeholder="Filtrar títulos, canais…" autocomplete="off">
    </div>

    <div class="top-actions">
      <span class="conn" id="connStatus"><i></i><span>sem chave</span></span>
      <button class="btn btn-primary" id="newItem"><svg class="ico"><use href="#i-plus"/></svg>Novo item</button>
    </div>
  </header>

  <main id="view" class="page"></main>
</div>

<div class="scrim" id="scrim"></div>
<div id="toastRoot" class="toasts" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
